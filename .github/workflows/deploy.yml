name: Deploy 3mensioXMLParser to VPS

# Manual deploys only -- nexus serves this repo's live working copy as the
# dev site, so pushes to main are dev-server saves, not releases. Ship to
# production from the Actions tab or `gh workflow run deploy.yml`.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "${{ secrets.VPS_DEPLOY_KEY }}" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan vps-4b80346f.vps.ovh.us >> "$HOME/.ssh/known_hosts"

      - name: Render identity secrets file
        shell: bash
        env:
          SINGLE_AUTH_DB_HOST: ${{ secrets.VPS_SINGLE_AUTH_DB_HOST }}
          SINGLE_AUTH_DB_PORT: ${{ secrets.VPS_SINGLE_AUTH_DB_PORT }}
          SINGLE_AUTH_DB_NAME: ${{ secrets.VPS_SINGLE_AUTH_DB_NAME }}
          SINGLE_AUTH_DB_USER: ${{ secrets.VPS_SINGLE_AUTH_DB_USER }}
          SINGLE_AUTH_DB_PASS: ${{ secrets.VPS_SINGLE_AUTH_DB_PASS }}
          SINGLE_AUTH_CA_CERT: ${{ secrets.SINGLE_AUTH_CA_CERT }}
        run: |
          set -euo pipefail
          # GA4_PROPERTY_ID / GA_SERVICE_ACCOUNT_JSON and the
          # ga-config.php.template render used to happen here too (GitHub
          # secrets rendered to secrets/ga-config.php at deploy time). GA4
          # migration Task 3 replaced that whole mechanism: GA4_PROPERTY_ID
          # is now a `vars.*` value rendered into .env below, and the
          # credential itself is the fleet-wide reader.json bind-mounted
          # read-only from /etc/secrets/ga on the VPS (compose.yml) --
          # never a per-repo secret at all, so there is nothing left to
          # render for GA here.
          : "${SINGLE_AUTH_DB_HOST:?}" "${SINGLE_AUTH_DB_PORT:?}" "${SINGLE_AUTH_DB_NAME:?}" "${SINGLE_AUTH_DB_USER:?}" "${SINGLE_AUTH_DB_PASS:?}" "${SINGLE_AUTH_CA_CERT:?}"
          command -v envsubst >/dev/null || (sudo apt-get update && sudo apt-get install -y gettext-base)
          mkdir -p /tmp/mensioxml-secrets

          SINGLE_AUTH_DB_HOST_B64="$(printf '%s' "$SINGLE_AUTH_DB_HOST" | base64 -w0)"
          SINGLE_AUTH_DB_PORT_B64="$(printf '%s' "$SINGLE_AUTH_DB_PORT" | base64 -w0)"
          SINGLE_AUTH_DB_NAME_B64="$(printf '%s' "$SINGLE_AUTH_DB_NAME" | base64 -w0)"
          SINGLE_AUTH_DB_USER_B64="$(printf '%s' "$SINGLE_AUTH_DB_USER" | base64 -w0)"
          SINGLE_AUTH_DB_PASS_B64="$(printf '%s' "$SINGLE_AUTH_DB_PASS" | base64 -w0)"
          export SINGLE_AUTH_DB_HOST_B64 SINGLE_AUTH_DB_PORT_B64 SINGLE_AUTH_DB_NAME_B64
          export SINGLE_AUTH_DB_USER_B64 SINGLE_AUTH_DB_PASS_B64
          envsubst '$SINGLE_AUTH_DB_HOST_B64 $SINGLE_AUTH_DB_PORT_B64 $SINGLE_AUTH_DB_NAME_B64 $SINGLE_AUTH_DB_USER_B64 $SINGLE_AUTH_DB_PASS_B64' \
            < deploy/secrets/identity-db-config.php.template > /tmp/mensioxml-secrets/identity-db-config.php

          printf '%s\n' "$SINGLE_AUTH_CA_CERT" > /tmp/mensioxml-secrets/single-auth-ca.pem

      - name: Ship secrets via rsync
        shell: bash
        run: |
          set -euo pipefail
          # Plain rsync -- NOT sftp+chmod 600. See this plan's Global
          # Constraints: mensioxml-deploy and the phpfpm container's
          # www-data (uid 82) are different users, so a 600 file owned by
          # mensioxml-deploy would be unreadable by the app.
          #
          # --chmod=D2750,F640 (tightened from the original default 644,
          # final review Finding 6): world-readable was broader than
          # needed -- 640 + group 82 (www-data inside vps-phpfpm:8.4, see
          # sites/mensioxml's ownership setup) still lets the app read
          # these while no longer exposing them to every local account on
          # the host. D2750 (not just a one-time `chmod g+s` on the VPS)
          # is deliberate: plain `-a` also preserves the *directory's*
          # mode from this rsync's own source side (/tmp/mensioxml-secrets,
          # plain 755, no setgid) on every run, which was found to
          # silently strip a hand-set setgid bit back off app/secrets/ on
          # the very next deploy. Forcing D2750 here makes the setgid bit
          # self-healing every run instead of a one-time VPS-side change
          # that the next deploy would quietly undo.
          rsync -avz --delete --chmod=D2750,F640 \
            -e "ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes" \
            /tmp/mensioxml-secrets/ \
            mensioxml-deploy@vps-4b80346f.vps.ovh.us:secrets/

      - name: Render .env and ship it
        id: putenv
        shell: bash
        env:
          GA4_MEASUREMENT_ID: "${{ vars.GA4_MEASUREMENT_ID }}"
          GA4_PROPERTY_ID: "${{ vars.GA4_PROPERTY_ID }}"
        run: |
          set -euo pipefail
          # This site has no database -- unlike diaslab's version of this
          # step, there is no DB_*/MYSQL_*/SMTP_* content to render here,
          # only the GA4 keys (GA4 migration Task 3). GA4_MEASUREMENT_ID
          # and GA4_PROPERTY_ID are GitHub *variables*, not secrets --
          # deliberately, they aren't sensitive. GA_SERVICE_ACCOUNT_FILE is
          # a fixed path, not a credential -- it points at the fleet-wide
          # reader.json bind-mounted read-only from /etc/secrets/ga on the
          # VPS (see compose.yml); nothing here ever holds the credential
          # itself.
          cat > /tmp/deploy.env <<EOF
          APP_ENV=production
          GA4_MEASUREMENT_ID=${GA4_MEASUREMENT_ID}
          GA4_PROPERTY_ID=${GA4_PROPERTY_ID}
          GA_SERVICE_ACCOUNT_FILE=/var/www/secrets/reader.json
          EOF
          ssh -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes \
            mensioxml-deploy@vps-4b80346f.vps.ovh.us put-env < /tmp/deploy.env | tee /tmp/put-env.out
          rm -f /tmp/deploy.env
          # put-env.sh reports whether .env actually changed. Only a real
          # change needs a container recreate (docker reads env_file at
          # create time only), and a recreate costs a few seconds of 502
          # that trips uptime monitoring -- so gate on this rather than
          # recreating on every code-only deploy.
          grep -q '^ENV_CHANGED=1$' /tmp/put-env.out \
            && echo "env_changed=true"  >> "$GITHUB_OUTPUT" \
            || echo "env_changed=false" >> "$GITHUB_OUTPUT"

      - name: Deploy code via rsync
        shell: bash
        run: |
          set -euo pipefail
          # local.marker must never land here -- see Global Constraints.
          rsync -avz --delete \
            --exclude 'admin/local.marker' \
            -e "ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes" \
            htdocs/ \
            mensioxml-deploy@vps-4b80346f.vps.ovh.us:htdocs/

      - name: Recreate containers so .env changes take effect
        if: steps.putenv.outputs.env_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # docker reads env_file ONLY when it CREATES a container, so the
          # put-env step above updates .env on disk while the running
          # php-fpm keeps its frozen copy -- a NEWLY ADDED variable never
          # reaches the app, and the symptom looks like an application bug
          # (correct value in .env, empty getenv() in the container). This
          # workflow had no recreate step at all before GA4 migration Task
          # 3 (verified 2026-09-02, `grep -c ENV_CHANGED` on the pre-change
          # file returned 0): without it, the GA keys would never have
          # reached the running process and the deploy would still report
          # success.
          #
          # `redeploy` is the site's existing forced command
          # (bin/redeploy.sh, already sudoers-permitted); it does
          # `docker compose up -d --force-recreate --wait` on php-fpm and
          # reloads nginx. `docker restart` would NOT fix this: it reuses
          # the same container and therefore the same frozen environment.
          #
          # This site has no database and no session store of its own --
          # single-auth sessions live in single_auth.sessions via
          # DbSessionHandler (see identity_config.php/auth.php), not on
          # this container's filesystem, so a recreate does not log anyone
          # out. Cost is a few seconds of 502.
          ssh -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes \
            mensioxml-deploy@vps-4b80346f.vps.ovh.us redeploy

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          # Real domain, real DNS -- NOT --resolve straight to the VPS's
          # IP. This VPS's 80/443 are DOCKER-USER-restricted to
          # Cloudflare's published IP ranges only (architecture.md's
          # Firewall section), so a GitHub Actions runner's IP can never
          # reach it via --resolve; the only request shape CI can use is
          # a real request through Cloudflare's edge, i.e. the real
          # domain over real DNS. (Found post-cutover, final review
          # Finding 1: runs 32575258603 and 32576430234 both black-holed
          # permanently on the old --resolve/-k form, regardless of DNS
          # state.)
          curl -sf https://3mensio.marktuttlemd.com/healthz.php | grep -q OK && echo "Deploy verified: healthz OK"
          # Assert the tag is actually present, not merely that healthz
          # responds. The public homepage (htdocs/index.html) is static --
          # it has its own hardcoded gtag snippet, not rendered by this
          # migration's Tag::render() (GA4 migration Task 3, Step 5: a
          # static page cannot call it; deferred, see task-3-report.md).
          # This assertion still earns its keep: it catches a regression
          # if that hardcoded snippet or its measurement ID is ever
          # dropped, same as diaslab's PHP-rendered equivalent.
          if ! curl -sf --max-time 20 https://3mensio.marktuttlemd.com/ | grep -q 'G-8LDBKP7S8S'; then
            echo "FAIL: homepage rendered but the GA measurement ID is absent." >&2
            exit 1
          fi
          echo "Deploy verified: GA measurement ID present on homepage"
