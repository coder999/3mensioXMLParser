name: Deploy 3mensioXMLParser to VPS

# Manual deploys only -- nexus serves this repo's live working copy as the
# dev site, so pushes to main are dev-server saves, not releases. Ship to
# production from the Actions tab or `gh workflow run deploy.yml`.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "${{ secrets.VPS_DEPLOY_KEY }}" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan vps-4b80346f.vps.ovh.us >> "$HOME/.ssh/known_hosts"

      - name: Render .env and ship it
        id: putenv
        shell: bash
        run: |
          set -euo pipefail
          # This site is static plus healthz.php: no database, no login, and
          # since its /admin pages moved to admin.marktuttle.dev (2026-10-31)
          # nothing reads GA settings at runtime either. The homepage's gtag
          # snippet is hardcoded in index.html. .env carries APP_ENV only.
          cat > /tmp/deploy.env <<EOF
          APP_ENV=production
          EOF
          ssh -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes \
            mensioxml-deploy@vps-4b80346f.vps.ovh.us put-env < /tmp/deploy.env | tee /tmp/put-env.out
          rm -f /tmp/deploy.env
          # put-env.sh reports whether .env actually changed. Only a real
          # change needs a container recreate (docker reads env_file at
          # create time only), and a recreate costs a few seconds of 502
          # that trips uptime monitoring -- so gate on this rather than
          # recreating on every code-only deploy.
          grep -q '^ENV_CHANGED=1$' /tmp/put-env.out \
            && echo "env_changed=true"  >> "$GITHUB_OUTPUT" \
            || echo "env_changed=false" >> "$GITHUB_OUTPUT"

      - name: Deploy code via rsync
        shell: bash
        run: |
          set -euo pipefail
          rsync -avz --delete \
            -e "ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes" \
            htdocs/ \
            mensioxml-deploy@vps-4b80346f.vps.ovh.us:htdocs/

      - name: Recreate containers so .env changes take effect
        if: steps.putenv.outputs.env_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # docker reads env_file ONLY when it CREATES a container, so the
          # put-env step above updates .env on disk while the running
          # php-fpm keeps its frozen copy -- a NEWLY ADDED variable never
          # reaches the app, and the symptom looks like an application bug
          # (correct value in .env, empty getenv() in the container). This
          # workflow had no recreate step at all before GA4 migration Task
          # 3 (verified 2026-09-02, `grep -c ENV_CHANGED` on the pre-change
          # file returned 0): without it, the GA keys would never have
          # reached the running process and the deploy would still report
          # success.
          #
          # `redeploy` is the site's existing forced command
          # (bin/redeploy.sh, already sudoers-permitted); it does
          # `docker compose up -d --force-recreate --wait` on php-fpm and
          # reloads nginx. `docker restart` would NOT fix this: it reuses
          # the same container and therefore the same frozen environment.
          #
          # This site has no database and no sessions, so a recreate loses
          # nothing. Cost is a few seconds of 502.
          ssh -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes \
            mensioxml-deploy@vps-4b80346f.vps.ovh.us redeploy

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          # Real domain, real DNS -- NOT --resolve straight to the VPS's
          # IP. This VPS's 80/443 are DOCKER-USER-restricted to
          # Cloudflare's published IP ranges only (architecture.md's
          # Firewall section), so a GitHub Actions runner's IP can never
          # reach it via --resolve; the only request shape CI can use is
          # a real request through Cloudflare's edge, i.e. the real
          # domain over real DNS. (Found post-cutover, final review
          # Finding 1: runs 32575258603 and 32576430234 both black-holed
          # permanently on the old --resolve/-k form, regardless of DNS
          # state.)
          #
          # Retries, not a single shot: the "Recreate containers so .env
          # changes take effect" step above force-recreates nginx, and
          # Traefik's docker provider only re-includes it in routing
          # after nginx's own Docker healthcheck completes its first
          # pass -- same window, same fix as
          # clinicaltrials/.github/workflows/deploy.yml's Verify step,
          # see that file's comment for the full mechanism. A single-shot
          # version of this exact check false-negatived on dash's
          # 2026-09-02 deploy; the site was verifiably fine a minute
          # later.
          #
          # The public homepage (htdocs/index.html) is static -- it has
          # its own hardcoded gtag snippet, not rendered by this
          # migration's Tag::render() (GA4 migration Task 3, Step 5: a
          # static page cannot call it; deferred, see task-3-report.md).
          # This assertion still earns its keep: it catches a regression
          # if that hardcoded snippet or its measurement ID is ever
          # dropped, same as diaslab's PHP-rendered equivalent. No
          # separate homepage-renders-completely check exists here (the
          # page is static, unlike the PHP sites), so this loop only
          # covers healthz + the GA ID.
          for i in $(seq 1 10); do
            if page="$(curl -sf https://3mensio.marktuttlemd.com/)" \
               && echo "$page" | grep -q 'G-8LDBKP7S8S' \
               && curl -sf https://3mensio.marktuttlemd.com/healthz.php | grep -q OK; then
              echo "Deploy verified: healthz OK, GA measurement ID present on homepage"
              exit 0
            fi
            sleep 3
          done
          echo "Deploy FAILED verification after 10 attempts (30s): expected a healthy healthz.php and GA measurement ID G-8LDBKP7S8S present on the homepage. Likely cause: the hardcoded gtag snippet or its ID was dropped from htdocs/index.html -- not the recreate-routing window, which this loop already absorbs." >&2
          exit 1
